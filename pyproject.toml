[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "xray-e2e-prober"
version = "0.1.1"
description = "End-to-end probes for Xray subscriptions and client profiles"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Xray E2E Prober contributors" }]
dependencies = [
  "click==8.1.8",
  "fastapi==0.115.6",
  "httpcore==1.0.9",
  "httpx[socks]==0.27.2",
  "prometheus-client==0.21.0",
  "prompt-toolkit==3.0.48",
  "pydantic==2.12.5",
  "PyYAML==6.0.2",
  "typer==0.15.1",
  "uvicorn==0.32.1",
]

[project.scripts]
prober = "xray_e2e_prober.cli:app"

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xray_e2e_prober"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: opt-in tests that execute the pinned Xray binary on local-only sockets",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]
